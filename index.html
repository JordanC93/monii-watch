<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monii Watch" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Envelope-method budgeting that syncs peer-to-peer." />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Monii Watch</title>
    <script>
      // Apply theme + matching iOS Dynamic Island / status-bar tint as
      // early as possible to avoid FOUC. Mirrors the table in
      // src/store/theme.ts → THEME_STATUS_BAR_COLOR. Resolves the Auto
      // theme to dark/light based on the OS preference.
      (function () {
        try {
          var saved = localStorage.getItem('monii:theme') || 'dark';
          var concrete = saved;
          if (saved === 'auto') {
            var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
            concrete = (mql && mql.matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', concrete);
          var colors = { light: '#eef0f3', dark: '#0b0d12', oled: '#000000', glass: '#050614' };
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = colors[concrete] || colors.dark;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
