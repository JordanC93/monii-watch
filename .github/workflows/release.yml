name: Release Monii Watch

# Builds desktop installers for Mac (.dmg) and Windows (.exe / .msi) when a
# version tag is pushed. Mac builds run on macos-latest, Windows on
# windows-latest. Linux .AppImage included as a bonus.
#
# Trigger by tagging:  git tag v0.5.0 && git push origin v0.5.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds. Universal (--target universal-apple-darwin)
          # was causing intermittent `bundle_dmg.sh` failures on
          # GitHub Actions runners — the universal artifacts double the
          # disk footprint AND `hdiutil create` locks contention with
          # the lipos step. Splitting into two single-arch builds is
          # both faster and reliable.
          #
          # macos-latest = ARM (M-series). macos-13 = the last Intel
          # runner GitHub still hosts (used for Intel Mac builds).
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            mac-arch: arm64
          - platform: macos-13
            args: --target x86_64-apple-darwin
            mac-arch: x64
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && (matrix.mac-arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build PWA
        run: npm run build

      # Diagnostic: confirms the signing secrets are reaching the runner
      # AND that the key material is in the expected format (base64-
      # encoded minisign private key). Prints byte counts and a header
      # match — never the actual secret content.
      - name: Verify signing keys present + format check
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty / not set"
            exit 1
          fi
          if [ -z "$PASS" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is empty / not set"
            exit 1
          fi
          echo "Signing key length: ${#KEY} bytes"
          echo "Signing pass length: ${#PASS} bytes"

          # The Tauri CLI accepts the private key as either:
          #   (a) base64-encoded contents (one long line, what tauri signer
          #       generate -w produces by default), OR
          #   (b) raw minisign key file content (multi-line, starts with
          #       'untrusted comment:').
          # Detect which format we have so we can give a clear hint if it's
          # malformed.
          # 'dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWduIGVuY3J5cHRlZCBzZWNyZXQga2V5'
          # is the base64 encoding of 'untrusted comment: rsign encrypted secret key'
          B64_HEADER='dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWduIGVuY3J5cHRlZCBzZWNyZXQga2V5'
          B64_HEADER_UNENC='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHNlY3JldCBrZXk'
          if [[ "$KEY" == "$B64_HEADER"* ]]; then
            echo "Format: base64-encoded ENCRYPTED private key (expected — has password)"
          elif [[ "$KEY" == "$B64_HEADER_UNENC"* ]]; then
            echo "::warning::Format: base64-encoded UNENCRYPTED private key (no password) — Tauri's auto-signing may skip this"
          elif [[ "$KEY" == "untrusted comment:"* ]]; then
            echo "::warning::Format: RAW minisign key content (multi-line). Tauri usually accepts this, but base64-encoded is safer in CI."
          else
            echo "::error::Key doesn't match any known minisign format. First 16 chars of value: ${KEY:0:16}"
            echo "         (the header is non-secret — it's literally the same for every key in the world)"
            echo "         You probably pasted the WRONG value. Should start with 'dW50cn...' (base64) or 'untrusted comment:' (raw)."
          fi
          # Check for accidental whitespace / quotes that copy-paste sometimes adds
          if [[ "${KEY:0:1}" == " " ]] || [[ "${KEY:0:1}" == $'\t' ]]; then
            echo "::error::Key has leading whitespace — re-paste the secret without leading spaces/tabs"
          fi
          if [[ "${KEY: -1}" == " " ]] || [[ "${KEY: -1}" == $'\t' ]]; then
            echo "::error::Key has trailing whitespace — re-paste the secret without trailing spaces/tabs"
          fi
          if [[ "${KEY:0:1}" == '"' ]] || [[ "${KEY:0:1}" == "'" ]]; then
            echo "::error::Key starts with a quote character — paste the value WITHOUT surrounding quotes"
          fi

      - name: Tauri build
        # Pinned to a specific tauri-action release. v0 (floating tag)
        # has had latest.json regressions in the past.
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing keys. Required for the updater bundles
          # to be signed. Without these, .sig files won't be produced
          # and latest.json (created in the next job) fails to find them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Monii Watch ${{ github.ref_name }}'
          releaseBody: 'Auto-built installers. Choose the file for your OS. Existing installs upgrade automatically via Settings → Updates.'
          releaseDraft: true
          prerelease: false
          # `includeUpdaterJson: true` is best-effort — the dedicated
          # `publish-updater-json` job below writes a deterministic
          # latest.json after all platforms finish.
          includeUpdaterJson: true
          updaterJsonKeepUniversalBinary: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # If tauri-action's auto-signing was skipped (silently — Tauri 2
      # logs nothing when the key env var doesn't parse the way it
      # expects), explicitly call `tauri signer sign` on each updater
      # bundle. The CLI uses the same env vars but its failure modes
      # are loud — wrong key prints a real error message we can read.
      - name: Sign updater bundles (explicit fallback)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set +e   # don't fail the whole job if one bundle fails to sign
          BUNDLES="$(find src-tauri/target -path '*/release/bundle/*' \
            \( -name '*.app.tar.gz' -o -name '*.nsis.zip' -o -name '*.AppImage.tar.gz' \) 2>/dev/null)"
          if [ -z "$BUNDLES" ]; then
            echo "No updater bundles found (none to sign)"
            exit 0
          fi
          echo "--- Signing updater bundles ---"
          while IFS= read -r bundle; do
            if [ -f "$bundle.sig" ]; then
              echo "Already signed: $bundle.sig"
              continue
            fi
            echo "Signing: $bundle"
            npx --yes tauri signer sign "$bundle" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            if [ -f "$bundle.sig" ]; then
              echo "  ✓ Signature written: $bundle.sig ($(wc -c < "$bundle.sig") bytes)"
            else
              echo "  ::error::Signing did not produce $bundle.sig"
            fi
          done <<< "$BUNDLES"

      # Diagnostic + safety net: list every artifact tauri produced and
      # explicitly upload .sig files (which tauri-action sometimes fails
      # to attach to the release). The .sig files live alongside the
      # bundles in src-tauri/target/<triple>/release/bundle/.
      - name: List + upload signature files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "--- All bundle artifacts on disk ---"
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
               -o -name "*.exe" -o -name "*.msi" -o -name "*.nsis.zip" -o -name "*.nsis.zip.sig" \
               -o -name "*.AppImage" -o -name "*.AppImage.tar.gz" -o -name "*.AppImage.tar.gz.sig" \
               -o -name "*.deb" -o -name "*.rpm" \) 2>/dev/null | sort

          echo "--- Signature files ---"
          SIGS="$(find src-tauri/target -path '*/release/bundle/*' -name "*.sig" 2>/dev/null)"
          if [ -z "$SIGS" ]; then
            echo "::error::NO .sig files were produced! Signing did not run."
            echo "  Check tauri-action's stdout above for signing errors."
            echo "  Common causes:"
            echo "    - TAURI_SIGNING_PRIVATE_KEY in secrets is wrong/empty"
            echo "    - TAURI_SIGNING_PRIVATE_KEY_PASSWORD is wrong"
            echo "    - The pubkey in tauri.conf.json doesn't match the private key"
            exit 1
          fi

          echo "$SIGS"
          echo "--- Uploading .sig files to release ---"
          while IFS= read -r sig; do
            echo "Uploading: $sig"
            gh release upload "$TAG" "$sig" --clobber
          done <<< "$SIGS"

  publish-updater-json:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Get the asset name list. Drafts are hidden from `gh api
          # repos/.../releases/tags/<tag>` so we use `gh release view`
          # which respects draft state.
          ASSETS_JSON="$(gh release view "$TAG" --repo "$OWNER_REPO" --json assets --jq '.assets')"
          echo "--- Found assets ---"
          echo "$ASSETS_JSON" | jq -r '.[].name'

          # Build canonical tag-based URLs for latest.json. These URLs
          # work for ALL public releases regardless of when the file
          # was uploaded, and they survive draft→published state
          # transitions cleanly.
          asset_canonical_url() {
            local pattern="$1"
            local name; name="$(echo "$ASSETS_JSON" | jq -r ".[] | select(.name | test(\"$pattern\")) | .name" | head -1)"
            if [ -z "$name" ] || [ "$name" = "null" ]; then return; fi
            local encoded; encoded="$(printf '%s' "$name" | sed 's/ /%20/g')"
            printf 'https://github.com/%s/releases/download/%s/%s' "$OWNER_REPO" "$TAG" "$encoded"
          }

          # Download a .sig file's content via authenticated `gh release
          # download`. This bypasses the previous flaky path of
          # `gh api releases/assets/<id>` (which had asset-ID lookup
          # bugs that ended up storing GitHub's 404 error JSON as the
          # signature). `gh release download` works for drafts and
          # uses the canonical asset path.
          read_sig_by_name() {
            local pattern="$1"
            local name; name="$(echo "$ASSETS_JSON" | jq -r ".[] | select(.name | test(\"$pattern\")) | .name" | head -1)"
            if [ -z "$name" ] || [ "$name" = "null" ]; then return; fi
            local tmpdir; tmpdir="$(mktemp -d)"
            (cd "$tmpdir" && gh release download "$TAG" --repo "$OWNER_REPO" --pattern "$name" --clobber 2>/dev/null) || return
            if [ -f "$tmpdir/$name" ]; then
              cat "$tmpdir/$name"
            fi
            rm -rf "$tmpdir"
          }

          # Sanity check: signatures are minisign-format, base64-text,
          # ~400 bytes. If we got a JSON error response instead, refuse.
          validate_sig() {
            local content="$1"
            if [ -z "$content" ]; then return 1; fi
            # Reject anything that starts with `{` or `<` (HTML/JSON errors)
            local first="${content:0:1}"
            if [ "$first" = "{" ] || [ "$first" = "<" ]; then return 1; fi
            # Reject anything implausibly long (> 4 KB indicates we got
            # a metadata blob, not a signature)
            if [ "${#content}" -gt 4096 ]; then return 1; fi
            return 0
          }

          # Split macOS into per-arch bundles (v0.6.6+). Asset names
          # produced by Tauri 2 single-arch builds include the arch
          # (e.g. "Monii Watch_0.6.6_aarch64.app.tar.gz" /
          # "..._x64.app.tar.gz" / "..._x86_64.app.tar.gz" depending
          # on the Tauri CLI version).
          MAC_ARM_BUNDLE="$(asset_canonical_url 'aarch64\\.app\\.tar\\.gz$' || true)"
          MAC_ARM_SIG_RAW="$(read_sig_by_name 'aarch64\\.app\\.tar\\.gz\\.sig$' || true)"
          if validate_sig "$MAC_ARM_SIG_RAW"; then MAC_ARM_SIG="$MAC_ARM_SIG_RAW"; else MAC_ARM_SIG=""; fi

          MAC_X64_BUNDLE="$(asset_canonical_url '(x64|x86_64)\\.app\\.tar\\.gz$' || true)"
          MAC_X64_SIG_RAW="$(read_sig_by_name '(x64|x86_64)\\.app\\.tar\\.gz\\.sig$' || true)"
          if validate_sig "$MAC_X64_SIG_RAW"; then MAC_X64_SIG="$MAC_X64_SIG_RAW"; else MAC_X64_SIG=""; fi

          WIN_BUNDLE="$(asset_canonical_url 'x64-setup\\.nsis\\.zip$|x64-setup\\.exe$' || true)"
          WIN_SIG_RAW="$(read_sig_by_name 'x64-setup\\.nsis\\.zip\\.sig$|x64-setup\\.exe\\.sig$' || true)"
          if validate_sig "$WIN_SIG_RAW"; then WIN_SIG="$WIN_SIG_RAW"; else WIN_SIG=""; fi

          LIN_BUNDLE="$(asset_canonical_url '\\.AppImage\\.tar\\.gz$|\\.AppImage$' || true)"
          LIN_SIG_RAW="$(read_sig_by_name '\\.AppImage\\.tar\\.gz\\.sig$|\\.AppImage\\.sig$' || true)"
          if validate_sig "$LIN_SIG_RAW"; then LIN_SIG="$LIN_SIG_RAW"; else LIN_SIG=""; fi

          echo "--- Resolved bundles + signatures ---"
          echo "mac arm bundle:    ${MAC_ARM_BUNDLE:-<none>}"
          echo "mac arm sig bytes: ${#MAC_ARM_SIG}"
          echo "mac x64 bundle:    ${MAC_X64_BUNDLE:-<none>}"
          echo "mac x64 sig bytes: ${#MAC_X64_SIG}"
          echo "win bundle:        ${WIN_BUNDLE:-<none>}"
          echo "win sig bytes:     ${#WIN_SIG}"
          echo "lin bundle:        ${LIN_BUNDLE:-<none>}"
          echo "lin sig bytes:     ${#LIN_SIG}"

          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Build the platforms object in shell, then compose the final
          # JSON in one jq pass — avoids the variable-binding-with-parens
          # syntax that bit us before.
          PLATFORMS='{}'
          if [ -n "$MAC_ARM_BUNDLE" ] && [ -n "$MAC_ARM_SIG" ]; then
            PLATFORMS="$(echo "$PLATFORMS" | jq \
              --arg url "$MAC_ARM_BUNDLE" --arg sig "$MAC_ARM_SIG" \
              '. + {"darwin-aarch64": {"signature": $sig, "url": $url}}')"
          fi
          if [ -n "$MAC_X64_BUNDLE" ] && [ -n "$MAC_X64_SIG" ]; then
            PLATFORMS="$(echo "$PLATFORMS" | jq \
              --arg url "$MAC_X64_BUNDLE" --arg sig "$MAC_X64_SIG" \
              '. + {"darwin-x86_64": {"signature": $sig, "url": $url}}')"
          fi
          if [ -n "$WIN_BUNDLE" ] && [ -n "$WIN_SIG" ]; then
            PLATFORMS="$(echo "$PLATFORMS" | jq \
              --arg url "$WIN_BUNDLE" --arg sig "$WIN_SIG" \
              '. + {"windows-x86_64": {"signature": $sig, "url": $url}}')"
          fi
          if [ -n "$LIN_BUNDLE" ] && [ -n "$LIN_SIG" ]; then
            PLATFORMS="$(echo "$PLATFORMS" | jq \
              --arg url "$LIN_BUNDLE" --arg sig "$LIN_SIG" \
              '. + {"linux-x86_64": {"signature": $sig, "url": $url}}')"
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg notes "See the release page for details." \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > latest.json

          echo "--- Generated latest.json ---"
          cat latest.json
          echo

          PLATFORM_COUNT="$(jq '.platforms | length' latest.json)"
          if [ "$PLATFORM_COUNT" -eq 0 ]; then
            echo "::error::No platforms made it into latest.json (no bundle/sig pairs found)."
            echo "  This usually means signing failed or signatures didn't get uploaded."
            echo "  Check the 'List + upload signature files' step output in each matrix job."
            exit 1
          fi

          gh release delete-asset "$TAG" latest.json --yes 2>/dev/null || true
          gh release upload "$TAG" latest.json --clobber
          echo "Uploaded latest.json to $TAG ($PLATFORM_COUNT platform(s))"
