name: Release Cashbook

# Builds desktop installers for Mac (.dmg) and Windows (.exe / .msi) when a
# version tag is pushed. Mac builds run on macos-latest, Windows on
# windows-latest. Linux .AppImage included as a bonus.
#
# Trigger by tagging:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build PWA
        run: npm run build

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing keys. Optional — when these secrets aren't
          # set, builds still publish but won't be signed and the desktop
          # auto-updater will refuse them on install. See docs/RELEASES.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cashbook ${{ github.ref_name }}'
          releaseBody: 'Auto-built installers. Choose the file for your OS. Existing installs upgrade automatically via Settings → Updates.'
          releaseDraft: true
          prerelease: false
          # `--bundles` ensures the updater bundle artifact is built alongside
          # the regular installer, and tauri-action will upload its signature
          # files (.sig) and produce the latest.json manifest.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
