name: Release Monii Watch

# Builds desktop installers for Mac (.dmg) and Windows (.exe / .msi) when a
# version tag is pushed. Mac builds run on macos-latest, Windows on
# windows-latest. Linux .AppImage included as a bonus.
#
# Trigger by tagging:  git tag v0.5.0 && git push origin v0.5.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build PWA
        run: npm run build

      # Diagnostic: confirms the signing secrets are reaching the runner.
      # Prints byte counts only — never the actual key material.
      - name: Verify signing keys present
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty / not set"
            exit 1
          fi
          if [ -z "$PASS" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is empty / not set"
            exit 1
          fi
          echo "Signing key length: ${#KEY} bytes"
          echo "Signing pass length: ${#PASS} bytes"

      - name: Tauri build
        # Pinned to a specific tauri-action release. v0 (floating tag)
        # has had latest.json regressions in the past.
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing keys. Required for the updater bundles
          # to be signed. Without these, .sig files won't be produced
          # and latest.json (created in the next job) fails to find them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Monii Watch ${{ github.ref_name }}'
          releaseBody: 'Auto-built installers. Choose the file for your OS. Existing installs upgrade automatically via Settings → Updates.'
          releaseDraft: true
          prerelease: false
          # `includeUpdaterJson: true` is best-effort — the dedicated
          # `publish-updater-json` job below writes a deterministic
          # latest.json after all platforms finish.
          includeUpdaterJson: true
          updaterJsonKeepUniversalBinary: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Diagnostic + safety net: list every artifact tauri produced and
      # explicitly upload .sig files (which tauri-action sometimes fails
      # to attach to the release). The .sig files live alongside the
      # bundles in src-tauri/target/<triple>/release/bundle/.
      - name: List + upload signature files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "--- All bundle artifacts on disk ---"
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
               -o -name "*.exe" -o -name "*.msi" -o -name "*.nsis.zip" -o -name "*.nsis.zip.sig" \
               -o -name "*.AppImage" -o -name "*.AppImage.tar.gz" -o -name "*.AppImage.tar.gz.sig" \
               -o -name "*.deb" -o -name "*.rpm" \) 2>/dev/null | sort

          echo "--- Signature files ---"
          SIGS="$(find src-tauri/target -path '*/release/bundle/*' -name "*.sig" 2>/dev/null)"
          if [ -z "$SIGS" ]; then
            echo "::error::NO .sig files were produced! Signing did not run."
            echo "  Check tauri-action's stdout above for signing errors."
            echo "  Common causes:"
            echo "    - TAURI_SIGNING_PRIVATE_KEY in secrets is wrong/empty"
            echo "    - TAURI_SIGNING_PRIVATE_KEY_PASSWORD is wrong"
            echo "    - The pubkey in tauri.conf.json doesn't match the private key"
            exit 1
          fi

          echo "$SIGS"
          echo "--- Uploading .sig files to release ---"
          while IFS= read -r sig; do
            echo "Uploading: $sig"
            gh release upload "$TAG" "$sig" --clobber
          done <<< "$SIGS"

  publish-updater-json:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Drafts are hidden from `gh api repos/.../releases/tags/<tag>`,
          # so we use `gh release view` which respects draft state.
          ASSETS_JSON="$(gh release view "$TAG" --repo "$OWNER_REPO" --json assets --jq '.assets')"
          echo "--- Found assets ---"
          echo "$ASSETS_JSON" | jq -r '.[].name'

          # Build canonical tag-based URLs for latest.json. The `url`
          # field from `gh release view` returns a temporary "untagged-"
          # URL while the release is a draft — those 404 once the
          # release is published. Canonical URLs are stable across
          # draft → published transitions.
          asset_canonical_url() {
            local pattern="$1"
            local name; name="$(echo "$ASSETS_JSON" | jq -r ".[] | select(.name | test(\"$pattern\")) | .name" | head -1)"
            if [ -z "$name" ] || [ "$name" = "null" ]; then return; fi
            # URL-encode spaces (the only character GitHub URL-escapes
            # in asset filenames). + → %20.
            local encoded; encoded="$(printf '%s' "$name" | sed 's/ /%20/g')"
            printf 'https://github.com/%s/releases/download/%s/%s' "$OWNER_REPO" "$TAG" "$encoded"
          }
          asset_id() {
            local pattern="$1"
            echo "$ASSETS_JSON" | jq -r ".[] | select(.name | test(\"$pattern\")) | .id" | head -1
          }
          read_sig_content() {
            local pattern="$1"
            local id; id="$(asset_id "$pattern")"
            if [ -z "$id" ] || [ "$id" = "null" ]; then return; fi
            gh api "repos/$OWNER_REPO/releases/assets/$id" -H "Accept: application/octet-stream" 2>/dev/null || true
          }

          MAC_BUNDLE="$(asset_canonical_url '\\.app\\.tar\\.gz$' || true)"
          MAC_SIG="$(read_sig_content '\\.app\\.tar\\.gz\\.sig$')"
          WIN_BUNDLE="$(asset_canonical_url 'x64-setup\\.nsis\\.zip$|x64-setup\\.exe$' || true)"
          WIN_SIG="$(read_sig_content 'x64-setup\\.nsis\\.zip\\.sig$|x64-setup\\.exe\\.sig$')"
          LIN_BUNDLE="$(asset_canonical_url '\\.AppImage\\.tar\\.gz$|\\.AppImage$' || true)"
          LIN_SIG="$(read_sig_content '\\.AppImage\\.tar\\.gz\\.sig$|\\.AppImage\\.sig$')"

          echo "--- Resolved bundles + signatures ---"
          echo "mac bundle:    ${MAC_BUNDLE:-<none>}"
          echo "mac sig bytes: ${#MAC_SIG}"
          echo "win bundle:    ${WIN_BUNDLE:-<none>}"
          echo "win sig bytes: ${#WIN_SIG}"
          echo "lin bundle:    ${LIN_BUNDLE:-<none>}"
          echo "lin sig bytes: ${#LIN_SIG}"

          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Build the platforms object in shell, then compose the final
          # JSON in one jq pass — avoids the variable-binding-with-parens
          # syntax that bit us before.
          PLATFORMS='{}'
          if [ -n "$MAC_BUNDLE" ] && [ -n "$MAC_SIG" ]; then
            PLATFORMS="$(echo "$PLATFORMS" | jq \
              --arg url "$MAC_BUNDLE" --arg sig "$MAC_SIG" \
              '. + {"darwin-aarch64": {"signature": $sig, "url": $url}, "darwin-x86_64": {"signature": $sig, "url": $url}}')"
          fi
          if [ -n "$WIN_BUNDLE" ] && [ -n "$WIN_SIG" ]; then
            PLATFORMS="$(echo "$PLATFORMS" | jq \
              --arg url "$WIN_BUNDLE" --arg sig "$WIN_SIG" \
              '. + {"windows-x86_64": {"signature": $sig, "url": $url}}')"
          fi
          if [ -n "$LIN_BUNDLE" ] && [ -n "$LIN_SIG" ]; then
            PLATFORMS="$(echo "$PLATFORMS" | jq \
              --arg url "$LIN_BUNDLE" --arg sig "$LIN_SIG" \
              '. + {"linux-x86_64": {"signature": $sig, "url": $url}}')"
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg notes "See the release page for details." \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > latest.json

          echo "--- Generated latest.json ---"
          cat latest.json
          echo

          PLATFORM_COUNT="$(jq '.platforms | length' latest.json)"
          if [ "$PLATFORM_COUNT" -eq 0 ]; then
            echo "::error::No platforms made it into latest.json (no bundle/sig pairs found)."
            echo "  This usually means signing failed or signatures didn't get uploaded."
            echo "  Check the 'List + upload signature files' step output in each matrix job."
            exit 1
          fi

          gh release delete-asset "$TAG" latest.json --yes 2>/dev/null || true
          gh release upload "$TAG" latest.json --clobber
          echo "Uploaded latest.json to $TAG ($PLATFORM_COUNT platform(s))"
