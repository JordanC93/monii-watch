name: Release Monii Watch

# Builds desktop installers for Mac (.dmg) and Windows (.exe / .msi) when a
# version tag is pushed. Mac builds run on macos-latest, Windows on
# windows-latest. Linux .AppImage included as a bonus.
#
# Trigger by tagging:  git tag v0.5.0 && git push origin v0.5.0
#
# After the matrix builds finish, the `publish-updater-json` job runs
# once on a single Mac runner to write `latest.json` (the auto-updater
# manifest) into the same release. Doing this AFTER the matrix avoids
# the race condition where three platform builds all try to write
# latest.json in parallel and one of them silently wins (or none does).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build PWA
        run: npm run build

      - name: Tauri build
        # Pinned to a specific tauri-action release. v0 (floating tag)
        # has had latest.json regressions in the past.
        uses: tauri-apps/tauri-action@v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-updater signing keys. Required for the updater bundles
          # to be signed. Without these the .sig files won't be produced
          # and latest.json (created in the next job) will fail to find
          # signatures.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Monii Watch ${{ github.ref_name }}'
          releaseBody: 'Auto-built installers. Choose the file for your OS. Existing installs upgrade automatically via Settings → Updates.'
          releaseDraft: true
          prerelease: false
          # `includeUpdaterJson: true` works MOST of the time but races
          # in the matrix. The dedicated `publish-updater-json` job below
          # writes a deterministic latest.json after all platforms finish.
          includeUpdaterJson: true
          # Keep the universal binary metadata in latest.json — without
          # this, the macOS Intel + ARM single .app gets dropped from
          # the manifest and Mac users would be told "no update."
          updaterJsonKeepUniversalBinary: true
          # Prefer NSIS (.exe) over MSI for Windows updater bundles —
          # NSIS is what Tauri's updater shells out to on install.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # Single follow-up job that walks the just-published release's assets
  # and writes a clean latest.json. Catches the case where the matrix
  # runs all completed but none wrote a complete manifest. Idempotent:
  # if a working latest.json is already there, this overwrites with the
  # same content.
  publish-updater-json:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate + upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `gh api repos/.../releases/tags/<tag>` returns 404 for DRAFT
          # releases — the by-tag REST endpoint hides drafts even when
          # authenticated as the repo owner. Workaround: `gh release
          # view` uses the GraphQL API path that DOES surface drafts.
          # `--json assets` returns name + id + url (the public download
          # URL, stable across draft/published states).
          ASSETS_JSON="$(gh release view "$TAG" --repo "$OWNER_REPO" --json assets --jq '.assets')"
          echo "--- Found assets ---"
          echo "$ASSETS_JSON" | jq -r '.[].name'

          # Public URL (for embedding in latest.json — stable, becomes
          # accessible once the release is published)
          asset_url() {
            local pattern="$1"
            echo "$ASSETS_JSON" | jq -r ".[] | select(.name | test(\"$pattern\")) | .url" | head -1
          }
          # Asset ID (for downloading content via authenticated API,
          # which works on drafts unlike the public URL)
          asset_id() {
            local pattern="$1"
            echo "$ASSETS_JSON" | jq -r ".[] | select(.name | test(\"$pattern\")) | .id" | head -1
          }
          # Download a .sig file's textual content via the authenticated
          # API. The Accept header is what makes GitHub return the raw
          # bytes instead of a JSON metadata object.
          read_sig_content() {
            local pattern="$1"
            local id; id="$(asset_id "$pattern")"
            if [ -z "$id" ] || [ "$id" = "null" ]; then return; fi
            gh api "repos/$OWNER_REPO/releases/assets/$id" -H "Accept: application/octet-stream" 2>/dev/null || true
          }

          MAC_BUNDLE="$(asset_url '\\.app\\.tar\\.gz$' || true)"
          MAC_SIG="$(read_sig_content '\\.app\\.tar\\.gz\\.sig$')"
          WIN_BUNDLE="$(asset_url 'x64-setup\\.exe$' || true)"
          WIN_SIG="$(read_sig_content 'x64-setup\\.nsis\\.zip\\.sig$|x64-setup\\.exe\\.sig$')"
          LIN_BUNDLE="$(asset_url '\\.AppImage$' || true)"
          LIN_SIG="$(read_sig_content '\\.AppImage\\.sig$')"

          echo "--- Resolved bundle URLs ---"
          echo "mac:   ${MAC_BUNDLE:-<none>}"
          echo "mac sig bytes: ${#MAC_SIG}"
          echo "win:   ${WIN_BUNDLE:-<none>}"
          echo "win sig bytes: ${#WIN_SIG}"
          echo "linux: ${LIN_BUNDLE:-<none>}"
          echo "linux sig bytes: ${#LIN_SIG}"

          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Build latest.json. Only includes platforms that have BOTH
          # a bundle and a signature.
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg notes "See the release page for details." \
            --arg mac_url "$MAC_BUNDLE" \
            --arg mac_sig "$MAC_SIG" \
            --arg win_url "$WIN_BUNDLE" \
            --arg win_sig "$WIN_SIG" \
            --arg lin_url "$LIN_BUNDLE" \
            --arg lin_sig "$LIN_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: (
                ({} as $p)
                | (if ($mac_url | length) > 0 and ($mac_sig | length) > 0
                   then ($p + {"darwin-aarch64": {"signature": $mac_sig, "url": $mac_url},
                              "darwin-x86_64":  {"signature": $mac_sig, "url": $mac_url}})
                   else $p end) as $p
                | (if ($win_url | length) > 0 and ($win_sig | length) > 0
                   then ($p + {"windows-x86_64": {"signature": $win_sig, "url": $win_url}})
                   else $p end) as $p
                | (if ($lin_url | length) > 0 and ($lin_sig | length) > 0
                   then ($p + {"linux-x86_64": {"signature": $lin_sig, "url": $lin_url}})
                   else $p end)
              )
            }' > latest.json

          echo "--- Generated latest.json ---"
          cat latest.json
          echo

          # Sanity: refuse to upload an empty platforms manifest. Better to
          # fail loudly than ship a broken updater payload.
          PLATFORM_COUNT="$(jq '.platforms | length' latest.json)"
          if [ "$PLATFORM_COUNT" -eq 0 ]; then
            echo "ERROR: No platforms made it into latest.json (no bundle/sig pairs found)."
            echo "       Check that the matrix builds completed AND that signing keys are configured."
            exit 1
          fi

          # If a latest.json is already attached, delete it first.
          # `gh release delete-asset` works on drafts.
          gh release delete-asset "$TAG" latest.json --yes 2>/dev/null || true
          gh release upload "$TAG" latest.json --clobber
          echo "Uploaded latest.json to $TAG ($PLATFORM_COUNT platform(s))"
